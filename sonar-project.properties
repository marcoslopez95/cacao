# Configuración del análisis SonarQube para el proyecto CACAO.
# Documentación: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

# ── Identificación ────────────────────────────────────────────────────────────
sonar.projectKey=cacao
sonar.projectName=CACAO
sonar.projectVersion=1.0

# ── Fuentes ───────────────────────────────────────────────────────────────────
# PHP: lógica de negocio, controladores, modelos, servicios
# TS/Vue: frontend Inertia.js
sonar.sources=app,resources/js

# Directorios de tests (SonarQube los trata diferente al código fuente)
sonar.tests=tests,tests/js

# ── Exclusiones del análisis ──────────────────────────────────────────────────
# Cada línea es un glob separado por coma; ajusta según necesidades del proyecto
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/public/**,\
  **/bootstrap/cache/**,\
  **/*.blade.php,\
  **/database/migrations/**,\
  **/database/seeders/**,\
  **/storage/**

# Excluir tests del análisis de cobertura (no contar los propios tests como código cubierto)
sonar.coverage.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/tests/**,\
  **/database/factories/**,\
  **/database/seeders/**

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── PHP ───────────────────────────────────────────────────────────────────────
sonar.php.version=8.3
# Reporte Clover generado por Pest con --coverage (ver phpunit.xml)
sonar.php.coverage.reportPaths=coverage/clover.xml

# ── JavaScript / TypeScript ───────────────────────────────────────────────────
# Reporte lcov generado por Vitest con pnpm test:coverage (ver vite.config.ts)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Extensiones a analizar en resources/js/
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.vue

# ── Patrones de archivos de test ──────────────────────────────────────────────
sonar.test.inclusions=\
  tests/**/*Test.php,\
  tests/**/*test.php,\
  tests/js/**/*.test.ts

# ── SCM ───────────────────────────────────────────────────────────────────────
# Necesario para que SonarQube calcule blame y nuevas líneas correctamente
sonar.scm.provider=git
