# SonarQube Community Build + mc1arke branch plugin para análisis de ramas y PRs.
# IMPORTANTE: coloca el JAR del plugin en docker/sonarqube/plugins/ antes de levantar.
# Lee README.md en esta carpeta para instrucciones paso a paso.

services:
  sonarqube:
    image: sonarqube:26.5.0.122743-community
    container_name: cacao-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # El plugin de ramas requiere inyectarse como javaagent en web Y ce
      SONAR_WEB_JAVAOPTS: >-
        -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.5.0.jar=web
      SONAR_CE_JAVAOPTS: >-
        -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.5.0.jar=ce
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      # Bind mount: el JAR del plugin se coloca en esta carpeta local
      - ./plugins:/opt/sonarqube/extensions/plugins
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - sonarnet
    restart: unless-stopped

  db:
    image: postgres:16.3-alpine3.20
    container_name: cacao-sonarqube-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sonarnet
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_db:

networks:
  sonarnet:
    driver: bridge
